
name: Check upstream release

on:
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create a pull request on GitHub'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create a draft GitHub release'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build in Arch Linux
        run: |
          docker run --rm -i \
            -e GITHUB_ACTIONS \
            -e ACT \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -s <<'ARCH'
          set -Eeuo pipefail

          pacman -Syu --noconfirm --needed \
            devtools namcap git jq nvchecker sudo \
            libx11 libxi libxinerama libxkbcommon libxtst pkgconf

          # Unprivilegierten Build-Benutzer anlegen
          groupadd --system builder
          useradd --system --create-home \
            --gid builder --shell /bin/bash builder

          # sudo für die Dependency-Auflösung von makepkg
          printf 'builder ALL=(ALL:ALL) NOPASSWD: /usr/bin/pacman\n' \
            > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          visudo -cf /etc/sudoers.d/builder

          # Repository in den Container kopieren
          mkdir -p /build
          cp -a /workspace/. /build/
          chown -R builder:builder /build

          # Git-Verzeichnis für builder freigeben
          su - builder -s /bin/bash -c \
            "git config --global --add safe.directory /build"

          # Legacy-Bibliothek bauen und installieren
          su - builder -s /bin/bash -c \
            "cd /build/libxdo3 && makepkg -Csf --noconfirm"

          pacman -U --noconfirm /build/libxdo3/*.pkg.tar.zst

          # Hypergate aktualisieren und bauen
          su - builder -s /bin/bash -c \
            'cd /build && GITHUB_ACTIONS="$1" ACT="$2" bash -x ./update.sh' \
            _ "${GITHUB_ACTIONS:-}" "${ACT:-}"

          # Paketmetadaten und beide Pakete zurückkopieren
          cp -f /build/PKGBUILD /build/.SRCINFO /workspace/
          cp -f /build/libxdo3/*.pkg.tar.zst /workspace/

          for package in /build/*.pkg.tar.zst; do
            [[ -f "$package" ]] || continue
            cp -f "$package" /workspace/
          done

          ARCH

      - name: Upload package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: hypergate-bin-package
          path: "**/*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 14

      - name: Prepare update branch
        id: update
        if: ${{ github.event_name == 'schedule' || inputs.create_pr || inputs.create_release }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Error: Updates must be created from master."
            exit 1
          fi

          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "No update available."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)
          branch="automation/update-${version}"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$branch"
          git add PKGBUILD .SRCINFO
          git commit -m "Update Hypergate to ${version}"
          git push --force origin "$branch"

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create update pull request
        if: ${{ (github.event_name == 'schedule' || inputs.create_pr) && steps.update.outputs.updated == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.update.outputs.version }}"
          branch="${{ steps.update.outputs.branch }}"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "Update Hypergate to ${version}" \
            --body "Automated upstream update. Package built and checked in Arch Linux. Please review dependencies and package contents before merging."

      - name: Create draft release
        if: ${{ (github.event_name == 'schedule' || inputs.create_release) && steps.update.outputs.updated == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.update.outputs.version }}"
          branch="${{ steps.update.outputs.branch }}"
          tag="v${version}"

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Error: Releases must be created from master."
            exit 1
          fi

          # Vorhandenes Tag niemals überschreiben
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]]; then
            echo "Error: Tag ${tag} already exists."
            exit 1
          fi

          # Genau beide Pakete müssen vorhanden sein
          shopt -s nullglob
          packages=(./*.pkg.tar.zst)

          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "Error: Expected exactly two packages."
            exit 1
          fi

          gh release create "$tag" \
            "${packages[@]}" \
            --draft \
            --title "Hypergate ${version}" \
            --generate-notes \
            --target "$branch"
